<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกี่ยวกับฉัน</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            width:100vw;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#111;
            font-family:Arial,sans-serif;
            overflow:hidden;
        }

        h1{
            font-size:clamp(40px,9vw,140px);
            text-align:center;
            color:#ff2d2d;
            font-weight:bold;
            text-shadow:0 0 20px rgba(255,0,0,.6);
            padding:20px;
            animation:flash .8s infinite;
        }

        @keyframes flash{
            0%,100%{
                color:#ff2d2d;
            }
            50%{
                color:#fff;
            }
        }

        ::selection{
            background:yellow;
            color:black;
        }
    </style>
</head>

<body>

<h1>กุว่าละว่ามึงไม่เต็ม 😂</h1>

</body>
</html>
