<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>มาดูหน้าคนไม่เต็มกัน</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:black;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
overflow:hidden;
color:white;
text-align:center;
}

#text{
font-size:clamp(40px,7vw,100px);
font-weight:bold;
padding:20px;
}

img{
display:none;
width:min(90vw,500px);
border-radius:15px;
opacity:1;
transition:opacity 3s;
}

.fade{
opacity:0;
}

#btn{
display:none;
margin-top:30px;
padding:18px 40px;
font-size:32px;
background:#0d6efd;
color:white;
border-radius:15px;
text-decoration:none;
}

</style>

</head>

<body>

<div id="text">
มาดูหน้าคนไม่เต็มกัน 😂
</div>

<img id="img" src="face.png">

<a id="btn" href="about.html">
👉 เกี่ยวกับฉัน
</a>

<script>

const text=document.getElementById("text");
const img=document.getElementById("img");
const btn=document.getElementById("btn");

setTimeout(()=>{
text.innerHTML="หยอกเล่น 😂";
},2000);

setTimeout(()=>{
text.style.display="none";
img.style.display="block";
},4000);

setTimeout(()=>{
img.classList.add("fade");
},7000);

setTimeout(()=>{
img.style.display="none";
btn.style.display="inline-block";
},10000);

</script>

</body>
</html>
